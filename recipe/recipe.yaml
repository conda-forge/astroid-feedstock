schema_version: 1

context:
  version: "4.3.3"

package:
  name: astroid
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/astroid/astroid-${{ version }}.tar.gz
  sha256: d03854b09d92c08e18d8e7d9185d393961186ed0747136d8fcb2d1c008a504ec

build:
  number: 0
  skip: match(python, "<3.10")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python_
        - cross-python_${{ target_platform }}
  host:
    - python
    - setuptools >=77
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - astroid
      pip_check: true

about:
  summary: An abstract syntax tree for Python with inference support.
  license: LGPL-2.1-only
  license_file: LICENSE
  homepage: https://pypi.org/project/astroid/

extra:
  recipe-maintainers:
    - wshanks
    - timkpaine
    - jakirkham
    - ocefpaf
